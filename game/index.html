<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay — Open-World Crime</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; }
  #game { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; inset: 0; pointer-events: none; font-family: Arial, Helvetica, sans-serif; color: #fff; }
  #hud * { text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 2px rgba(0,0,0,0.8); }
  .hud-money { position: absolute; top: 14px; left: 18px; font-size: 40px; font-weight: bold; color: #ffd23d; }
  .hud-sub { position: absolute; top: 62px; left: 18px; font-size: 17px; color: #fff; }
  .hud-objective { position: absolute; top: 88px; left: 18px; font-size: 19px; color: #ffe9a8; max-width: 560px; }
  .hud-stars { position: absolute; top: 14px; right: 18px; font-size: 34px; letter-spacing: 2px; color: #fff; opacity: 0.9; }
  .hud-stars.hot { color: #ffd23d; }
  .hud-health { position: absolute; top: 58px; right: 18px; width: 220px; height: 22px; border: 2px solid #fff; background: rgba(0,0,0,0.5); }
  .hud-health-bar { height: 100%; width: 100%; background: #3dd97a; }
  .hud-health-num { position: absolute; top: 0; right: 6px; font-size: 15px; font-weight: bold; line-height: 22px; }
  .hud-banner { position: absolute; top: 118px; left: 0; right: 0; text-align: center; font-size: 26px; font-weight: bold; color: #ffd23d; }
  .hud-message { position: absolute; top: 165px; left: 0; right: 0; text-align: center; font-size: 20px; color: #fff; }
  .hud-speed { position: absolute; bottom: 56px; left: 18px; font-size: 52px; font-weight: bold; }
  .hud-speed span { font-size: 16px; color: #ffd23d; }
  .hud-prompt { position: absolute; bottom: 108px; left: 18px; font-size: 20px; font-weight: bold; color: #5eff8a; }
  .hud-controls { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; font-size: 15px; color: #ddd; }
  .hud-crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 30px; font-weight: bold; color: #fff; }
  .hud-minimap { position: absolute; bottom: 14px; right: 14px; width: 220px; height: 220px; border: 3px solid #fff; background: rgba(20,26,20,0.85); }
  .hud-title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .title-name { font-size: 64px; font-weight: bold; color: #ffd23d; letter-spacing: 4px; }
  .title-tag { font-size: 18px; color: #fff; margin-top: 6px; }
  .title-story { font-size: 17px; color: #eee; max-width: 760px; margin-top: 18px; line-height: 1.5; background: rgba(0,0,0,0.82); border: 3px solid #ffd23d; padding: 18px 22px; }
  .title-save { font-size: 16px; color: #5eff8a; margin-top: 16px; }
  .title-play { font-size: 26px; font-weight: bold; color: #fff; margin-top: 18px; animation: blink 1.1s steps(2) infinite; }
  .title-controls { font-size: 14px; color: #ddd; margin-top: 16px; line-height: 1.6; }
  @keyframes blink { 50% { opacity: 0.25; } }
  .hud-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(10,10,40,0.55); text-align: center; }
  .overlay-big { font-size: 44px; font-weight: bold; color: #fff; }
  .overlay-sub { font-size: 18px; color: #ddd; margin-top: 10px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<div class="sr-only" role="status" aria-live="polite">Solmar Bay — open-world crime game</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
